server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness probe for Docker/compose healthchecks. Not proxied to the PM server.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # The PM server has no authentication of its own. Expose it only through this
    # reverse proxy, which requires HTTP basic auth for every /api/ request
    # (including reads and mutations). Do not serve /api/ without auth_basic.
    location /api/ {
        auth_basic "planner-pm";
        auth_basic_user_file /etc/nginx/htpasswd;

        # Reject simple cross-site form submissions carrying JSON as text/plain.
        if ($request_method = POST) {
            set $post_request 1;
        }
        if ($content_type !~* "^application/json([;]|$)") {
            set $post_request "${post_request}x";
        }
        if ($post_request = 1x) { return 415; }

        proxy_pass http://127.0.0.1:7808;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for the frontend.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
